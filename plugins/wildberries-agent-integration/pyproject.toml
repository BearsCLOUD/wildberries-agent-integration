[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wildberries-agent-integration"
version = "0.1.7"
description = "Русскоязычная MCP-интеграция Wildberries: аналитика продавца, юнит-экономика и прогноз пополнения."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BearsCLOUD"}]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
  "starlette>=0.37,<1",
]

[project.scripts]
wildberries-agent-mcp = "wildberries_agent_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
