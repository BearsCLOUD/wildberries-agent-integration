[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wildberries-agent-integration"
version = "0.1.10"
description = "Русскоязычная MCP-интеграция Wildberries: аналитика, отзывы, конкуренты, SEO, карточки, фото, регионы, погода, юнит-экономика и пополнение."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BearsCLOUD"}]
keywords = [
  "Wildberries",
  "аналитика продавца",
  "конкурентный анализ",
  "SEO Wildberries",
  "поисковая оптимизация",
  "региональная аналитика",
  "погодные факторы",
  "прокси для Wildberries",
  "создание карточки товара",
  "дизайн-система",
  "генерация фото товара",
  "юнит-экономика",
  "прогноз пополнения",
  "анализ отзывов Wildberries",
  "Wildberries Seller API",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
  "starlette>=0.37,<1",
]

[project.scripts]
wildberries-agent-mcp = "wildberries_agent_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
