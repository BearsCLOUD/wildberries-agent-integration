<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Wildberries Agent Integration — аналитика и пополнение</title>
  <desc id="desc">Оригинальная иллюстрация: агент объединяет продажи, решения и безопасное подключение Seller</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
