      <stop offset=".55" stop-color="#311052"/>
      <stop offset="1" stop-color="#5B163D"/>
    </linearGradient>
    <linearGradient id="panel" x1="748" y1="72" x2="1185" y2="350" gradientUnits="userSpaceOnUse">
