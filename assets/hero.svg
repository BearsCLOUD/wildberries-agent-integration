    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0B0618" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#surface)"/>
  <circle cx="210" cy="60" r="170" fill="#A855F7" fill-opacity=".2" filter="url(#glow)"/>
  <circle cx="1130" cy="375" r="180" fill="#FB7185" fill-opacity=".15" filter="url(#glow)"/>
  <path d="M70 72h82" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
