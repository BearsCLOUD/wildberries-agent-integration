name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/wildberries-agent-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ruff==0.15.10
      - run: python -m pytest -q
      - run: ruff check src tests
      - run: python -m compileall -q src
      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (Path('.codex-plugin/plugin.json'), Path('.claude-plugin/plugin.json')):
              data = json.loads(path.read_text())
              assert data['name'] == 'wildberries-agent-integration'
              assert data['version'] == '0.1.12'
          json.loads(Path('.mcp.json').read_text())
          json.loads(Path('alpic.json').read_text())
          claude = json.loads(Path('.claude-plugin/plugin.json').read_text())
          assert claude['mcpServers'] == './claude/mcp.json'
          json.loads(Path('claude/mcp.json').read_text())
          skills = Path('skills')
          skill_files = sorted(skills.glob('*/SKILL.md'))
          assert len(skill_files) == 16
          for skill_file in skill_files:
              lines = skill_file.read_text(encoding='utf-8').splitlines()
              assert lines[0] == '---'
              assert lines[1].startswith('name: ')
              assert lines[2].startswith('description: ')
              assert lines[1].split(':', 1)[1].strip() == skill_file.parent.name
              assert lines[2].split(':', 1)[1].strip()
          PY
