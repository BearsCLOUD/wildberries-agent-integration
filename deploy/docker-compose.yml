services:
  wildberries-agent-mcp:
    build:
      context: ../plugins/wildberries-agent-integration
    env_file:
      - ../plugins/wildberries-agent-integration/.env
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
